name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Push to Render
        run: |
          curl -X POST --data '{"branch":"main"}' https://api.render.com/deploy/svc_your_service_id \
          -H "Authorization: Bearer your_api_key" \
          -H "Content-Type: application/json"