services:
  web:
    type: web_service
    env: docker
    dockerfile_path: Dockerfile
    build_command: docker build -t my-app:1.0 .
    start_command: nginx -g 'daemon off;'
    health_check:
      path: /
      interval: 30s
      timeout: 5s
      healthy_threshold: 3
      unhealthy_threshold: 3